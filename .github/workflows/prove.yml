# Prove veloci a ogni modifica: solo logica (copione, tempi, gesti, 3D, impostazioni, una prova per ogni difetto
# corretto), senza browser e senza render: una decina di secondi.
# Le prove lente (browser, render, pannello) si lanciano sul proprio computer quando si tocca il kit:
#   npm run collaudo        npm run prove:lente
name: prove
on:
  push:
  pull_request:
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # --ignore-scripts: non scarica il programma ffmpeg (qui non serve) e l'installazione dura pochi secondi
      - run: npm install --no-audit --no-fund --ignore-scripts
      - run: npm test
